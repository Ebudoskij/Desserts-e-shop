spring.application.name=dessert-shop

# Database properties
spring.datasource.url=jdbc:postgresql://localhost:5433/dessert_shop
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.show-sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate

# Multipart files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# MVC -> REST requests
spring.mvc.hiddenmethod.filter.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=1d
jwt.refresh.expiration=7d
jwt.cookies.name=jwt-token
jwt.refresh.cookie.name=jwt-refresh-token

# Security
app.security.initial-admin.email=${ADMIN_EMAIL}
app.security.initial-admin.password=${ADMIN_PASSWORD}
