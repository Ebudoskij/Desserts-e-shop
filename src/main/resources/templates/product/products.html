<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Продукти - Магазин Десертів</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header" sec:authorize="hasRole('ADMIN')">
        <h1>Продукти</h1>
        <a th:href="@{/products/add}" class="btn btn-primary">Додати Новий Продукт</a>
    </div>

    <div style="margin-bottom: 1rem;">
        <button type="button"
                class="btn btn-secondary"
                onclick="toggleCategoryStats()"
                id="statsToggleBtn">
            Показати статистику
        </button>
    </div>

    <div th:replace="~{fragments/categoryStats :: categoryStats}"></div>
    
    <div class="mb-4" th:if="${productFilteringDto?.categoryId != null}" style="display: flex; align-items: center; gap: 10px;">
        <span style="font-weight: 500; color: #4b5563;">Обрана категорія: 
            <span th:each="category : ${categories}" th:if="${category.id == productFilteringDto.categoryId}" th:text="${category.name}"></span>
        </span>
        <a th:href="@{/products}" class="btn btn-sm btn-outline" style="padding: 2px 8px; font-size: 0.8rem; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 4px; text-decoration: none;">Скинути категорію</a>
    </div>

    <!-- Filters Panel -->
    <div class="filters-panel mb-4">
        <form th:action="@{/products}" method="get" class="filters-form">
            <!-- Search -->
            <div class="filter-group">
                <label>Пошук</label>
                <input type="text" name="searchQuery" th:value="${productFilteringDto?.searchQuery}" placeholder="Пошук продуктів..." class="form-control" style="width: 200px;"/>
            </div>
            
            <!-- Price Range -->
            <div class="filter-group price-filter">
                <label>Ціна (₴)</label>
                <div class="price-inputs" style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="number" id="minPriceInput" name="minPrice" th:value="${productFilteringDto?.minPrice != null ? productFilteringDto.minPrice : (minPrice != null ? minPrice : 0)}" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" step="0.01" class="form-control" style="width: 90px; text-align: center;"/>
                    <span> - </span>
                    <input type="number" id="maxPriceInput" name="maxPrice" th:value="${productFilteringDto?.maxPrice != null ? productFilteringDto.maxPrice : (maxPrice != null ? maxPrice : 1000)}" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" step="0.01" class="form-control" style="width: 90px; text-align: center;"/>
                </div>
                <div class="range-slider">
                    <input type="range" id="minPriceRange" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" th:value="${productFilteringDto?.minPrice != null ? productFilteringDto.minPrice : (minPrice != null ? minPrice : 0)}" step="0.01">
                    <input type="range" id="maxPriceRange" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" th:value="${productFilteringDto?.maxPrice != null ? productFilteringDto.maxPrice : (maxPrice != null ? maxPrice : 1000)}" step="0.01">
                    <div class="slider-track"></div>
                    <div id="slider-range" class="slider-range"></div>
                </div>
            </div>

            <!-- Status -->
            <div class="filter-group" sec:authorize="hasRole('ADMIN')">
                <label>Статус</label>
                <select name="deleted" class="form-control" style="width: 150px;">
                    <option value="">Всі</option>
                    <option value="false" th:selected="${productFilteringDto?.deleted != null and !productFilteringDto.deleted}">Активні</option>
                    <option value="true" th:selected="${productFilteringDto?.deleted != null and productFilteringDto.deleted}">Видалені</option>
                </select>
            </div>

            <!-- Sorting & Pagination Params -->
            <div class="filter-group">
                <label>Сортування</label>
                <select name="sort" class="form-control" style="width: 200px;">
                    <option value="id,asc" th:selected="${#strings.equals(param.sort, 'id,asc') or param.sort == null}">Звичайне</option>
                    <option value="pricePerUnit,desc" th:selected="${#strings.equals(param.sort, 'pricePerUnit,desc')}">Від дорогих</option>
                    <option value="pricePerUnit,asc" th:selected="${#strings.equals(param.sort, 'pricePerUnit,asc')}">Від дешевих</option>
                    <option value="name,desc" th:selected="${#strings.equals(param.sort, 'name,desc')}">За назвою, за спаданням</option>
                    <option value="name,asc" th:selected="${#strings.equals(param.sort, 'name,asc')}">За назвою, за зростанням</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Показати</label>
                <select name="size" class="form-control" style="width: 80px;">
                    <option value="5" th:selected="${pageResponse.pageSize == 5}">5</option>
                    <option value="10" th:selected="${pageResponse.pageSize == 10}">10</option>
                    <option value="20" th:selected="${pageResponse.pageSize == 20}">20</option>
                    <option value="50" th:selected="${pageResponse.pageSize == 50}">50</option>
                </select>
            </div>

            <div class="filter-actions" style="display: flex; align-items: flex-end; gap: 0.5rem; padding-bottom: 2px;">
                <button type="submit" class="btn btn-primary">Застосувати</button>
                <a th:href="@{/products}" class="btn btn-secondary">Скинути все</a>
            </div>

            <input type="hidden" name="categoryId" th:if="${productFilteringDto?.categoryId != null}" th:value="${productFilteringDto.categoryId}"/>
        </form>
    </div>

    <!-- Categories List -->
    <div class="categories-list mb-4" th:if="${productFilteringDto?.categoryId == null}" style="display: flex; overflow-x: auto; gap: 10px; padding-bottom: 5px;">
        <a th:each="category : ${categories}" th:href="@{/products(categoryId=${category.id})}" class="category-badge">
            <span th:text="${category.name}">Категорія</span>
        </a>
    </div>

    <div class="product-grid" th:if="${not #lists.isEmpty(pageResponse.content)}" id="productGrid">
        <div class="product-card" th:each="product : ${pageResponse.content}" th:data-url="@{/products/{id}(id=${product.id})}" th:classappend="${product.isDeleted ? 'product-card-deleted' : ''}">
            <div class="product-card-img-container">
                <img th:if="${product.mainImageUrl != null and !product.mainImageUrl.isEmpty()}" th:src="${product.mainImageUrl}" alt="Зображення продукту" style="width: 100%; height: 100%; object-fit: cover;">
                <span th:unless="${product.mainImageUrl != null and !product.mainImageUrl.isEmpty()}" style="color: #ccc;">Немає фото</span>
            </div>
            <div class="product-card-body">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h3 class="product-card-title" th:text="${product.name}">Назва продукту</h3>
                    <span style="font-size: 0.8rem; color: #999;" th:text="'#' + ${product.id}" sec:authorize="hasRole('ADMIN')">#1</span>
                </div>
                <div class="product-card-category" th:text="${product.category.name}">Категорія</div>
                
                <div class="product-card-price">
                    <span th:text="${#numbers.formatDecimal(product.pricePerUnit, 1, 2)}">10.00</span>
                    <span style="font-size: 1rem; font-weight: normal; color: var(--text-color);" th:text="' ₴ / ' + ${product.unitType}">₴ / шт</span>
                </div>
                
                <div class="product-card-actions">
                    <button type="button" class="btn btn-sm btn-primary btn-icon-text action-btn" sec:authorize="hasRole('USER') or isAnonymous()"
                            th:data-id="${product.id}" 
                            th:data-name="${product.name}" 
                            th:data-custom="${product.customizable}"
                            onclick="openOrderModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-custom') === 'true');"
                            title="Додати в кошик" th:if="${!product.isDeleted}">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="pointer-events: none;"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        Додати в кошик
                    </button>
                    <a th:href="@{/products/{id}/update(id=${product.id})}" class="btn btn-sm btn-secondary action-btn" th:if="${!product.isDeleted}" sec:authorize="hasRole('ADMIN')">Редагувати</a>
                    <form th:action="@{/products/{id}(id=${product.id})}" th:method="delete" style="display: flex; margin: 0;" th:if="${!product.isDeleted}" sec:authorize="hasRole('ADMIN')">
                        <button type="button" class="btn btn-sm btn-danger action-btn" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете видалити цей продукт?');">Видалити</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(pageResponse.content)}" class="text-center" style="margin: 3rem 0; padding: 2rem; background-color: var(--white); border-radius: 8px;">
        <p style="font-size: 1.25rem; color: var(--light-brown);">Продуктів не знайдено.</p>
    </div>

    <!-- Pagination -->
    <div th:if="${pageResponse.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${pageResponse.pageNo == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/products(page=${pageResponse.pageNo - 1}, size=${pageResponse.pageSize}, sort=${param.sort}, searchQuery=${productFilteringDto?.searchQuery}, minPrice=${productFilteringDto?.minPrice}, maxPrice=${productFilteringDto?.maxPrice}, categoryId=${productFilteringDto?.categoryId}, deleted=${productFilteringDto?.deleted})}" th:if="${pageResponse.pageNo > 0}">Попередня</a>
            </li>
            
            <li class="page-item" th:each="i : ${#numbers.sequence(0, pageResponse.totalPages - 1)}" th:classappend="${pageResponse.pageNo == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/products(page=${i}, size=${pageResponse.pageSize}, sort=${param.sort}, searchQuery=${productFilteringDto?.searchQuery}, minPrice=${productFilteringDto?.minPrice}, maxPrice=${productFilteringDto?.maxPrice}, categoryId=${productFilteringDto?.categoryId}, deleted=${productFilteringDto?.deleted})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${pageResponse.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/products(page=${pageResponse.pageNo + 1}, size=${pageResponse.pageSize}, sort=${param.sort}, searchQuery=${productFilteringDto?.searchQuery}, minPrice=${productFilteringDto?.minPrice}, maxPrice=${productFilteringDto?.maxPrice}, categoryId=${productFilteringDto?.categoryId}, deleted=${productFilteringDto?.deleted})}" th:if="${!pageResponse.last}">Наступна</a>
            </li>
        </ul>
    </div>
</div>

<div th:replace="~{fragments/modal :: confirmModal}"></div>
<div th:replace="~{fragments/modal :: confirmModalScript}"></div>
<div th:replace="~{fragments/orderModal :: orderModal}"></div>
<script th:src="@{/js/orderModal.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const grid = document.getElementById('productGrid');
        if (grid) {
            grid.addEventListener('click', function(event) {
                const card = event.target.closest('.product-card');
                
                if (!card) return;
                
                const isActionBtn = event.target.closest('.action-btn');
                
                if (!isActionBtn) {
                    const url = card.getAttribute('data-url');
                    if (url) {
                        window.location.href = url;
                    }
                }
            });
        }

        // Dual Slider Logic
        const minRange = document.getElementById('minPriceRange');
        const maxRange = document.getElementById('maxPriceRange');
        const minInput = document.getElementById('minPriceInput');
        const maxInput = document.getElementById('maxPriceInput');
        const sliderRange = document.getElementById('slider-range');

        if (minRange && maxRange && minInput && maxInput && sliderRange) {
            const updateSlider = () => {
                let minVal = parseFloat(minRange.value);
                let maxVal = parseFloat(maxRange.value);

                if (minVal > maxVal) {
                    let tmp = minVal; minVal = maxVal; maxVal = tmp;
                }

                const minLimit = parseFloat(minRange.min);
                const maxLimit = parseFloat(minRange.max);
                const rangeDiff = maxLimit - minLimit;

                const leftPercent = rangeDiff === 0 ? 0 : ((minVal - minLimit) / rangeDiff) * 100;
                const rightPercent = rangeDiff === 0 ? 0 : 100 - ((maxVal - minLimit) / rangeDiff) * 100;

                sliderRange.style.left = leftPercent + '%';
                sliderRange.style.right = rightPercent + '%';
            };

            minRange.addEventListener('input', function() {
                let minVal = parseFloat(minRange.value);
                let maxVal = parseFloat(maxRange.value);
                if (minVal > maxVal) { minRange.value = maxVal; minVal = maxVal; }
                minInput.value = minVal;
                updateSlider();
            });

            maxRange.addEventListener('input', function() {
                let minVal = parseFloat(minRange.value);
                let maxVal = parseFloat(maxRange.value);
                if (maxVal < minVal) { maxRange.value = minVal; maxVal = minVal; }
                maxInput.value = maxVal;
                updateSlider();
            });

            minInput.addEventListener('change', function() {
                let val = parseFloat(minInput.value);
                let maxLim = parseFloat(maxRange.max);
                let minLim = parseFloat(minRange.min);
                if (isNaN(val)) val = minLim;
                if (val < minLim) val = minLim;
                if (val > maxLim) val = maxLim;
                minInput.value = val;
                minRange.value = val;
                updateSlider();
            });

            maxInput.addEventListener('change', function() {
                let val = parseFloat(maxInput.value);
                let maxLim = parseFloat(maxRange.max);
                let minLim = parseFloat(minRange.min);
                if (isNaN(val)) val = maxLim;
                if (val > maxLim) val = maxLim;
                if (val < minLim) val = minLim;
                maxInput.value = val;
                maxRange.value = val;
                updateSlider();
            });

            updateSlider();
        }
    });
</script>

<script>
    function toggleCategoryStats() {
        const section = document.getElementById('categoryStatsSection');
        const btn     = document.getElementById('statsToggleBtn');
        const hidden  = section.style.display === 'none' || section.style.display === '';
        section.style.display = hidden ? 'block' : 'none';
        btn.textContent       = hidden ? 'Приховати статистику' : 'Показати статистику';
    }
</script>

</body>
</html>
