<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Product Details - Dessert Shop</title>
    <!-- Keep base typography and layout -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Add item specific styling -->
    <link rel="stylesheet" th:href="@{/css/item-detail.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <a th:href="@{/products}" class="btn btn-secondary" style="margin-bottom: auto;">← Повернутись до пошуку</a>
    </div>

    <div class="item-detail-container">
        <!-- Left Column: Image Carousel -->
        <div class="item-carousel-section" th:if="${response.images != null and !response.images.isEmpty()}">
            <!-- Main Display Image -->
            <div class="carousel-main-image-container">
                <img id="carouselMainImage" th:src="@{${response.images[0].url}}" alt="Зображення продукту">
                
                <button class="carousel-control prev" th:if="${response.images.size() > 1}" title="Previous">
                    <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                </button>
                <button class="carousel-control next" th:if="${response.images.size() > 1}" title="Next">
                    <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                </button>
            </div>
            
            <!-- Thumbnails List -->
            <div class="carousel-thumbnails" th:if="${response.images.size() > 1}">
                <img th:each="img, stat : ${response.images}" 
                     th:src="@{${img.url}}" 
                     th:class="'carousel-thumbnail' + (${stat.index == 0} ? ' active' : '')"
                     alt="Мініатюра">
            </div>
        </div>
        
        <!-- Placeholder if no images -->
        <div class="item-carousel-section" th:unless="${response.images != null and !response.images.isEmpty()}">
             <div class="carousel-main-image-container" style="display: flex; align-items: center; justify-content: center; background: #eaeaea;">
                 <span style="color: #999;">Немає фото</span>
             </div>
        </div>

        <!-- Right Column: Details Info -->
        <div class="item-info-section">
            <h1 class="item-title" th:text="${response.name}">Назва продукту</h1>
            
            <div th:if="${response.category != null}" style="color: #666; font-weight: 500; font-size: 1.1rem;" th:text="${response.category.name}">Категорія</div>

            <div class="item-price-block">
                <span class="item-price" th:text="${#numbers.formatDecimal(response.pricePerUnit, 1, 2)}">10.00</span>
                <span class="item-price">₴</span>
                <span class="item-unit" th:text="' / ' + ${response.unitType}"> / шт</span>
            </div>

            <div class="item-description" th:text="${response.description}">
                Опис продукту.
            </div>

            <div sec:authorize="hasRole('ADMIN')">
                <span style="color: #666; margin-right: 0.5rem; font-weight: 500;">Статус:</span>
                <span th:if="${response.isDeleted}" class="item-status-badge status-deleted">Видалений</span>
                <span th:unless="${response.isDeleted}" class="item-status-badge status-active">Активний</span>
            </div>

            <!-- Action Buttons Area -->
            <div class="item-actions-block">
                <!-- Order Button -->
                <button type="button" class="btn btn-primary btn-icon-text action-btn" sec:authorize="hasRole('USER') or isAnonymous()"
                        th:data-id="${response.id}" 
                        th:data-name="${response.name}" 
                        th:data-custom="${response.customizable}"
                        onclick="openOrderModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-custom') === 'true');"
                        title="Додати в кошик" th:if="${!response.isDeleted}">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="pointer-events: none;"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    Додати в кошик
                </button>
                
                <div class="admin-actions" sec:authorize="hasRole('ADMIN')">
                    <a th:if="${!response.isDeleted}" th:href="@{/products/{id}/update(id=${response.id})}" class="btn btn-secondary">Редагувати</a>
                    
                    <!-- Delete (if active) -->
                    <form th:if="${!response.isDeleted}" th:action="@{/products/{id}(id=${response.id})}" th:method="delete" style="display: flex; margin: 0;">
                        <button type="button" class="btn btn-danger" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете видалити цей продукт?');">Видалити</button>
                    </form>
                    
                    <!-- Restore Placeholder (if deleted) -->
                    <form th:if="${response.isDeleted}" th:action="@{/products/{id}/restore(id=${response.id})}" th:method="post" style="display: flex; margin: 0;">
                        <button type="button" class="btn btn-primary" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете відновити цей продукт?');">Відновити</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/modal :: confirmModal}"></div>
<div th:replace="~{fragments/modal :: confirmModalScript}"></div>
<div th:replace="~{fragments/orderModal :: orderModal}"></div>
<script th:src="@{/js/orderModal.js}"></script>

<!-- Carousel logic -->
<script th:src="@{/js/carousel.js}"></script>

</body>
</html>
