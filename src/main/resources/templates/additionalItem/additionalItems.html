<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Додатки - Магазин Десертів</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Додатки</h1>
        <a th:href="@{/extras/add}" class="btn btn-primary">Додати Новий Додаток</a>
    </div>

    <!-- Filters Panel -->
    <div class="filters-panel mb-4">
        <form th:action="@{/extras}" method="get" class="filters-form">
            <!-- Search -->
            <div class="filter-group">
                <label>Пошук</label>
                <input type="text" name="searchQuery" th:value="${additionalItemFilterDto?.searchQuery}" placeholder="Пошук додатків..." class="form-control" style="width: 200px;"/>
            </div>
            
            <!-- Price Range -->
            <div class="filter-group price-filter">
                <label>Ціна (₴)</label>
                <div class="price-inputs" style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="number" id="minPriceInput" name="minPrice" th:value="${additionalItemFilterDto?.minPrice != null ? additionalItemFilterDto.minPrice : (minPrice != null ? minPrice : 0)}" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" step="0.01" class="form-control" style="width: 90px; text-align: center;"/>
                    <span> - </span>
                    <input type="number" id="maxPriceInput" name="maxPrice" th:value="${additionalItemFilterDto?.maxPrice != null ? additionalItemFilterDto.maxPrice : (maxPrice != null ? maxPrice : 1000)}" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" step="0.01" class="form-control" style="width: 90px; text-align: center;"/>
                </div>
                <div class="range-slider">
                    <input type="range" id="minPriceRange" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" th:value="${additionalItemFilterDto?.minPrice != null ? additionalItemFilterDto.minPrice : (minPrice != null ? minPrice : 0)}" step="0.01">
                    <input type="range" id="maxPriceRange" th:min="${minPrice != null ? minPrice : 0}" th:max="${maxPrice != null ? maxPrice : 1000}" th:value="${additionalItemFilterDto?.maxPrice != null ? additionalItemFilterDto.maxPrice : (maxPrice != null ? maxPrice : 1000)}" step="0.01">
                    <div class="slider-track"></div>
                    <div id="slider-range" class="slider-range"></div>
                </div>
            </div>

            <!-- Status -->
            <div class="filter-group">
                <label>Статус</label>
                <select name="deleted" class="form-control" style="width: 150px;">
                    <option value="">Всі</option>
                    <option value="false" th:selected="${additionalItemFilterDto?.deleted != null and !additionalItemFilterDto.deleted}">Активні</option>
                    <option value="true" th:selected="${additionalItemFilterDto?.deleted != null and additionalItemFilterDto.deleted}">Видалені</option>
                </select>
            </div>

            <!-- Sorting & Pagination Params -->
            <div class="filter-group">
                <label>Сортування</label>
                <select name="sort" class="form-control" style="width: 200px;">
                    <option value="id,asc" th:selected="${#strings.equals(param.sort, 'id,asc') or param.sort == null}">Звичайне</option>
                    <option value="extraPrice,desc" th:selected="${#strings.equals(param.sort, 'extraPrice,desc')}">Від дорогих</option>
                    <option value="extraPrice,asc" th:selected="${#strings.equals(param.sort, 'extraPrice,asc')}">Від дешевих</option>
                    <option value="name,desc" th:selected="${#strings.equals(param.sort, 'name,desc')}">За назвою, за спаданням</option>
                    <option value="name,asc" th:selected="${#strings.equals(param.sort, 'name,asc')}">За назвою, за зростанням</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Показати</label>
                <select name="size" class="form-control" style="width: 80px;">
                    <option value="4" th:selected="${pageResponse.pageSize == 4}">4</option>
                    <option value="8" th:selected="${pageResponse.pageSize == 8}">8</option>
                    <option value="16" th:selected="${pageResponse.pageSize == 16}">16</option>
                    <option value="32" th:selected="${pageResponse.pageSize == 32}">32</option>
                </select>
            </div>

            <div class="filter-actions" style="display: flex; align-items: flex-end; gap: 0.5rem; padding-bottom: 2px;">
                <button type="submit" class="btn btn-secondary">Застосувати</button>
                <a th:href="@{/extras}" class="btn btn-outline" style="background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px;">Скинути все</a>
            </div>
        </form>
    </div>

    <div class="product-grid" th:if="${not #lists.isEmpty(pageResponse.content)}" id="productGrid">
        <div class="product-card" th:each="item : ${pageResponse.content}" th:data-url="@{/extras/{id}(id=${item.id})}" th:classappend="${item.isDeleted ? 'product-card-deleted' : ''}">
            <div class="product-card-img-container">
                <img th:if="${item.mainImageUrl != null and !item.mainImageUrl.isEmpty()}" th:src="${item.mainImageUrl}" alt="Зображення продукту" style="width: 100%; height: 100%; object-fit: cover;">
                <span th:unless="${item.mainImageUrl != null and !item.mainImageUrl.isEmpty()}" style="color: #ccc;">Немає фото</span>
            </div>
            <div class="product-card-body">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h3 class="product-card-title" th:text="${item.name}">Назва додатку</h3>
                    <span style="font-size: 0.8rem; color: #999;" th:text="'#' + ${item.id}">#1</span>
                </div>
                
                <div class="product-card-price">
                    <span th:text="${#numbers.formatDecimal(item.extraPrice, 1, 2)}">5.00</span>
                    <span style="font-size: 1rem; font-weight: normal; color: var(--text-color);"> ₴</span>
                </div>
                
                <div class="product-card-actions">
                    <a th:href="@{/extras/{id}/update(id=${item.id})}" class="btn btn-sm btn-secondary action-btn" th:if="${!item.isDeleted}">Редагувати</a>
                    <form th:action="@{/extras/{id}(id=${item.id})}" method="post" style="display: flex; margin: 0;" th:if="${!item.isDeleted}">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="button" class="btn btn-sm btn-danger action-btn" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете видалити цей декор?');">Видалити</button>
                    </form>
                    
                    <form th:if="${item.isDeleted}" th:action="@{/extras/{id}/restore(id=${item.id})}" th:method="post" style="display: flex; margin: 0; width: 100%;">
                        <button type="button" class="btn btn-sm action-btn" style="background-color: var(--success, #28a745); color: white; width: 100%;" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете відновити цей декор?');">Відновити</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(pageResponse.content)}" class="text-center" style="margin: 3rem 0; padding: 2rem; background-color: var(--white); border-radius: 8px;">
        <p style="font-size: 1.25rem; color: var(--light-brown);">Додатків не знайдено.</p>
    </div>

    <!-- Pagination -->
    <div th:if="${pageResponse.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${pageResponse.pageNo == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/extras(page=${pageResponse.pageNo - 1}, size=${pageResponse.pageSize}, sort=${param.sort}, searchQuery=${additionalItemFilterDto?.searchQuery}, minPrice=${additionalItemFilterDto?.minPrice}, maxPrice=${additionalItemFilterDto?.maxPrice}, deleted=${additionalItemFilterDto?.deleted})}" th:if="${pageResponse.pageNo > 0}">Попередня</a>
            </li>
            
            <li class="page-item" th:each="i : ${#numbers.sequence(0, pageResponse.totalPages - 1)}" th:classappend="${pageResponse.pageNo == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/extras(page=${i}, size=${pageResponse.pageSize}, sort=${param.sort}, searchQuery=${additionalItemFilterDto?.searchQuery}, minPrice=${additionalItemFilterDto?.minPrice}, maxPrice=${additionalItemFilterDto?.maxPrice}, deleted=${additionalItemFilterDto?.deleted})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${pageResponse.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/extras(page=${pageResponse.pageNo + 1}, size=${pageResponse.pageSize}, sort=${param.sort}, searchQuery=${additionalItemFilterDto?.searchQuery}, minPrice=${additionalItemFilterDto?.minPrice}, maxPrice=${additionalItemFilterDto?.maxPrice}, deleted=${additionalItemFilterDto?.deleted})}" th:if="${!pageResponse.last}">Наступна</a>
            </li>
        </ul>
    </div>
</div>

<div th:replace="~{fragments/modal :: confirmModal}"></div>
<div th:replace="~{fragments/modal :: confirmModalScript}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const grid = document.getElementById('productGrid');
        if (grid) {
            grid.addEventListener('click', function(event) {
                const card = event.target.closest('.product-card');
                
                if (!card) return;
                
                const isActionBtn = event.target.closest('.action-btn');
                
                if (!isActionBtn) {
                    const url = card.getAttribute('data-url');
                    if (url) {
                        window.location.href = url;
                    }
                }
            });
        }

        // Dual Slider Logic
        const minRange = document.getElementById('minPriceRange');
        const maxRange = document.getElementById('maxPriceRange');
        const minInput = document.getElementById('minPriceInput');
        const maxInput = document.getElementById('maxPriceInput');
        const sliderRange = document.getElementById('slider-range');

        if (minRange && maxRange && minInput && maxInput && sliderRange) {
            const updateSlider = () => {
                let minVal = parseFloat(minRange.value);
                let maxVal = parseFloat(maxRange.value);

                if (minVal > maxVal) {
                    let tmp = minVal; minVal = maxVal; maxVal = tmp;
                }

                const minLimit = parseFloat(minRange.min);
                const maxLimit = parseFloat(minRange.max);
                const rangeDiff = maxLimit - minLimit;

                const leftPercent = rangeDiff === 0 ? 0 : ((minVal - minLimit) / rangeDiff) * 100;
                const rightPercent = rangeDiff === 0 ? 0 : 100 - ((maxVal - minLimit) / rangeDiff) * 100;

                sliderRange.style.left = leftPercent + '%';
                sliderRange.style.right = rightPercent + '%';
            };

            minRange.addEventListener('input', function() {
                let minVal = parseFloat(minRange.value);
                let maxVal = parseFloat(maxRange.value);
                if (minVal > maxVal) { minRange.value = maxVal; minVal = maxVal; }
                minInput.value = minVal;
                updateSlider();
            });

            maxRange.addEventListener('input', function() {
                let minVal = parseFloat(minRange.value);
                let maxVal = parseFloat(maxRange.value);
                if (maxVal < minVal) { maxRange.value = minVal; maxVal = minVal; }
                maxInput.value = maxVal;
                updateSlider();
            });

            minInput.addEventListener('change', function() {
                let val = parseFloat(minInput.value);
                let maxLim = parseFloat(maxRange.max);
                let minLim = parseFloat(minRange.min);
                if (isNaN(val)) val = minLim;
                if (val < minLim) val = minLim;
                if (val > maxLim) val = maxLim;
                minInput.value = val;
                minRange.value = val;
                updateSlider();
            });

            maxInput.addEventListener('change', function() {
                let val = parseFloat(maxInput.value);
                let maxLim = parseFloat(maxRange.max);
                let minLim = parseFloat(minRange.min);
                if (isNaN(val)) val = maxLim;
                if (val > maxLim) val = maxLim;
                if (val < minLim) val = minLim;
                maxInput.value = val;
                maxRange.value = val;
                updateSlider();
            });

            updateSlider();
        }
    });
</script>

</body>
</html>
