<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати Додаток - Магазин Десертів</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Редагувати Додаток</h1>
        <a th:href="@{/extras}" class="btn btn-secondary">Повернутися до Додатків</a>
    </div>

    <div class="form-card">
        <form th:action="@{/extras/{id}(id=${id})}" th:object="${additionalItem}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_method" value="put" />
            
            <div class="form-group">
                <label for="name">Назва</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger">Помилка назви</span>
            </div>

            <div class="form-group">
                <label for="description">Опис</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger">Помилка опису</span>
            </div>

            <div class="form-group">
                <label for="extraPrice">Ціна додатку</label>
                <input type="number" id="extraPrice" th:field="*{extraPrice}" class="form-control" step="0.01" />
                <span th:if="${#fields.hasErrors('extraPrice')}" th:errors="*{extraPrice}" class="text-danger">Помилка ціни</span>
            </div>

            <div class="form-group" th:if="${additionalItemResponse.imageUrls != null and !additionalItemResponse.imageUrls.isEmpty()}">
                <label>Існуючі зображення (Виберіть, щоб видалити)</label>
                <div class="d-flex flex-wrap gap-3 mt-2">
                    <div th:each="imgUrl, iterStat : ${additionalItemResponse.imageUrls}" class="text-center">
                        <img th:src="@{${imgUrl}}" alt="Extra Image" style="max-height: 100px; border-radius: 5px; border: 1px solid #ccc; display: block; margin-bottom: 5px;"/>
                        <!-- We need Media IDs to delete properly. AdditionalItemResponseDto only has strings right now. 
                             Wait, MediaService.deleteEntityImages takes list of Longs. We should update AdditionalItemResponseDto to use MediaResponseDto instead of List<String>. -->
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="images">Нові зображення</label>
                <input type="file" id="images" name="images" class="form-control" multiple accept="image/*" />
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Оновити Додаток</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
