<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Extra Details - Dessert Shop</title>
    <!-- Keep base typography and layout -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Add item specific styling -->
    <link rel="stylesheet" th:href="@{/css/item-detail.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/extras}" class="btn btn-secondary" style="margin-bottom: auto;">← Повернутись до пошуку</a>
    </div>

    <div class="item-detail-container">
        <!-- Left Column: Image Carousel -->
        <div class="item-carousel-section" th:if="${response.imageUrls != null and !response.imageUrls.isEmpty()}">
            <!-- Main Display Image -->
            <div class="carousel-main-image-container">
                <img id="carouselMainImage" th:src="@{${response.imageUrls[0].url}}" alt="Зображення додатку">
                
                <button class="carousel-control prev" th:if="${response.imageUrls.size() > 1}" title="Previous">
                    <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                </button>
                <button class="carousel-control next" th:if="${response.imageUrls.size() > 1}" title="Next">
                    <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                </button>
            </div>
            
            <!-- Thumbnails List -->
            <div class="carousel-thumbnails" th:if="${response.imageUrls.size() > 1}">
                <img th:each="img, stat : ${response.imageUrls}" 
                     th:src="@{${img.url}}" 
                     th:class="'carousel-thumbnail' + (${stat.index == 0} ? ' active' : '')"
                     alt="Мініатюра">
            </div>
        </div>
        
        <!-- Placeholder if no images -->
        <div class="item-carousel-section" th:unless="${response.imageUrls != null and !response.imageUrls.isEmpty()}">
             <div class="carousel-main-image-container" style="display: flex; align-items: center; justify-content: center; background: #eaeaea;">
                 <span style="color: #999;">Немає фото</span>
             </div>
        </div>

        <!-- Right Column: Details Info -->
        <div class="item-info-section">
            <h1 class="item-title" th:text="${response.name}">Назва додатку</h1>
            
            <div class="item-price-block">
                <span class="item-price" th:text="${#numbers.formatDecimal(response.extraPrice, 1, 2)}">5.00</span>
                <span class="item-price">₴</span>
            </div>

            <div class="item-description" th:text="${response.description}">
                Опис додатку.
            </div>

            <div sec:authorize="hasRole('ADMIN')">
                <span style="color: #666; margin-right: 0.5rem; font-weight: 500;">Статус:</span>
                <span th:if="${response.isDeleted}" class="item-status-badge status-deleted">Видалений</span>
                <span th:unless="${response.isDeleted}" class="item-status-badge status-active">Активний</span>
            </div>

            <!-- Action Buttons Area -->
            <div class="item-actions-block">
                <div class="admin-actions" sec:authorize="hasRole('ADMIN')">
                    <a th:if="${!response.isDeleted}" th:href="@{/extras/{id}/update(id=${response.id})}" class="btn btn-secondary">Редагувати</a>
                    
                    <!-- Delete (if active) -->
                    <form th:if="${!response.isDeleted}" th:action="@{/extras/{id}(id=${response.id})}" method="post" style="display: flex; margin: 0;">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="button" class="btn btn-danger" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете видалити цей декор?');">Видалити</button>
                    </form>
                    
                    <!-- Restore Placeholder (if deleted) -->
                    <form th:if="${response.isDeleted}" th:action="@{/extras/{id}/restore(id=${response.id})}" th:method="post" style="display: flex; margin: 0;">
                        <button type="button" class="btn btn-primary" onclick="openConfirmModal(this.closest('form'), 'Ви впевнені, що хочете відновити цей декор?');">Відновити</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/modal :: confirmModal}"></div>
<div th:replace="~{fragments/modal :: confirmModalScript}"></div>

<!-- Carousel logic -->
<script th:src="@{/js/carousel.js}"></script>

</body>
</html>
