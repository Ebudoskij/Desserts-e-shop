<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - Магазин Десертів</title>
    <!-- Use standard styles as a baseline -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Append custom auth override styling -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<!-- Minimal Navbar restricted to Home link -->
<nav class="auth-navbar">
    <a th:href="@{/}" class="auth-navbar-brand">Магазин Десертів</a>
</nav>

<div class="auth-container" style="padding: 1rem;">
    <!-- Slightly wider card for registration form density -->
    <div class="auth-card" style="max-width: 480px; padding: 2rem;">
        <div class="auth-header">
            <h1>Реєстрація</h1>
            <p>Створіть новий обліковий запис</p>
        </div>

        <form th:action="@{/auth/clients/register}" method="post" th:object="${user}">
            
            <div class="auth-form-group">
                <label for="fullName">Повне ім'я</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="auth-form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="Введіть ваше ім'я" autofocus required/>
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="validation-error">Помилка імені</span>
            </div>

            <div class="auth-form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" class="auth-form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="Введіть ваш email" required/>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="validation-error">Помилка Email</span>
            </div>

            <div class="auth-form-group">
                <label for="phoneNumber">Номер телефону</label>
                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="auth-form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''" placeholder="099-123-45-67" required/>
                <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="validation-error">Помилка номера</span>
            </div>

            <div class="auth-form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" th:field="*{password}" class="auth-form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Створіть надійний пароль" required/>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="validation-error">Помилка пароля</span>
                <small style="color: #8B7355; font-size: 0.75rem; display: block; margin-top: 5px;">*Мінімум 8 символів: одна велика буква, одна мала буква, цифра та спецсимвол.</small>
            </div>

            <button type="submit" class="auth-btn-submit" style="margin-top: 0.5rem;">Зареєструватися</button>

            <div class="auth-footer">
                <a th:href="@{/auth/login}" class="auth-link">Якщо вже маєте акаунт</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
