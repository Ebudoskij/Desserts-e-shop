<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Details - Dessert Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/item-detail.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Категорія</h1>
        <div>
            <a th:href="@{/categories/{id}/update(id=${response.id})}" class="btn btn-primary">Редагувати Категорію</a>
            <a th:href="@{/categories}" class="btn btn-secondary">Повернутись до Списку</a>
        </div>
    </div>

    <div class="detail-card">
        <div class="detail-row">
            <div class="detail-label">ID</div>
            <div class="detail-value" th:text="${response.id}">1</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Назва</div>
            <div class="detail-value" th:text="${response.name}">Name</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Опис</div>
            <div class="detail-value" th:text="${response.description}">Description</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Батьківська Категорія</div>
            <div class="detail-value" th:text="${response.parent != null ? response.parent.name : 'Відсутня'}">Parent</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Статус</div>
            <div class="detail-value">
                <span th:if="${response.isDeleted}" class="item-status-badge status-deleted">Видалена</span>
                <span th:unless="${response.isDeleted}" class="item-status-badge status-active">Активна</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
