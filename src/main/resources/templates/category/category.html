<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Details - Dessert Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Category Details</h1>
        <div>
            <a th:href="@{/categories/{id}/update(id=${response.id})}" class="btn btn-primary">Edit Category</a>
            <a th:href="@{/categories}" class="btn btn-secondary">Back to Categories</a>
        </div>
    </div>

    <div class="detail-card">
        <div class="detail-row">
            <div class="detail-label">ID</div>
            <div class="detail-value" th:text="${response.id}">1</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Name</div>
            <div class="detail-value" th:text="${response.name}">Name</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Description</div>
            <div class="detail-value" th:text="${response.description}">Description</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Parent Category</div>
            <div class="detail-value" th:text="${response.parent != null ? response.parent.name : 'None'}">Parent</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Status</div>
            <div class="detail-value">
                <span th:if="${response.isDeleted}" class="text-danger">Deleted</span>
                <span th:unless="${response.isDeleted}">Active</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
