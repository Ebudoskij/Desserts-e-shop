<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Додати Категорію - Магазин Десертів</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Додати Нову Категорію</h1>
        <a th:href="@{/categories}" class="btn btn-secondary">Повернутися до Категорій</a>
    </div>

    <div class="form-card">
        <form th:action="@{/categories}" th:object="${category}" method="post">
            <div class="form-group">
                <label for="name">Назва</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger">Помилка назви</span>
            </div>

            <div class="form-group">
                <label for="description">Опис</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger">Помилка опису</span>
            </div>

            <div class="form-group">
                <label for="parentId">Батьківська Категорія</label>
                <select id="parentId" th:field="*{parentId}" class="form-control">
                    <option value="">-- Немає --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Зберегти Категорію</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
